<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAI - Intelligent Shopping & Price Comparison Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .animate-glow { animation: pulseGlow 3s infinite ease-in-out; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">

    <!-- Root App Container -->
    <div id="app" class="h-full flex flex-col">
        <!-- Dynamic views rendered here -->
    </div>

    <!-- Custom Modal Container for Notifications & Alerts -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modal-icon-wrap" class="w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400">
                    <i id="modal-icon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold">Notice</h3>
            </div>
            <p id="modal-message" class="text-sm text-slate-600 dark:text-slate-300 mb-6 leading-relaxed">Message content goes here...</p>
            <div id="modal-actions" class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">Got it</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script>
        // State Management
        let state = {
            user: null, 
            registeredUsers: [], 
            currentView: 'auth', // 'auth', 'chat', 'wishlist', 'settings'
            authMode: 'login', // 'login', 'register'
            conversations: [], 
            activeChatId: null,
            wishlist: [], 
            isSearching: false,
            activeMessages: []
        };

        // Persistent Storage helpers
        function loadState() {
            const savedUser = localStorage.getItem('shopai_user');
            if (savedUser) {
                try { state.user = JSON.parse(savedUser); state.currentView = 'chat'; } catch(e){}
            }
            const savedDb = localStorage.getItem('shopai_registered_users');
            if (savedDb) {
                try { state.registeredUsers = JSON.parse(savedDb); } catch(e){}
            }
            const savedConversations = localStorage.getItem('shopai_conversations');
            if (savedConversations) {
                try { state.conversations = JSON.parse(savedConversations); } catch(e){}
            }
            const savedWishlist = localStorage.getItem('shopai_wishlist');
            if (savedWishlist) {
                try { state.wishlist = JSON.parse(savedWishlist); } catch(e){}
            }
            
            if (state.conversations.length === 0) {
                createNewChat("New Shopping Query");
            } else {
                state.activeChatId = state.conversations[0].id;
                state.activeMessages = state.conversations[0].messages;
            }
        }

        function saveStateToStorage() {
            if (state.user) {
                localStorage.setItem('shopai_user', JSON.stringify(state.user));
            } else {
                localStorage.removeItem('shopai_user');
            }
            localStorage.setItem('shopai_registered_users', JSON.stringify(state.registeredUsers));
            localStorage.setItem('shopai_conversations', JSON.stringify(state.conversations));
            localStorage.setItem('shopai_wishlist', JSON.stringify(state.wishlist));
        }

        // Custom Modal helper
        function showModal(title, message, type = 'info', customActions = null) {
            const container = document.getElementById('modal-container');
            const box = document.getElementById('modal-box');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconWrap = document.getElementById('modal-icon-wrap');
            const icon = document.getElementById('modal-icon');
            if (type === 'success') {
                iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-emerald-100 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-400';
                icon.className = 'fa-solid fa-circle-check text-lg';
            } else if (type === 'error') {
                iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-rose-100 text-rose-600 dark:bg-rose-950 dark:text-rose-400';
                icon.className = 'fa-solid fa-triangle-exclamation text-lg';
            } else {
                iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400';
                icon.className = 'fa-solid fa-circle-info text-lg';
            }

            const actionsWrap = document.getElementById('modal-actions');
            if (customActions) {
                actionsWrap.innerHTML = customActions;
            } else {
                actionsWrap.innerHTML = `<button onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">Got it</button>`;
            }

            container.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                container.classList.add('hidden');
            }, 150);
        }

        // Render Controller
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!state.user || state.currentView === 'auth') {
                app.innerHTML = renderAuthView();
            } else {
                app.innerHTML = renderMainLayout();
                initMainViewScripts();
            }
        }

        // ================= AUTHENTICATION VIEW =================
        function renderAuthView() {
            return `
                <div class="min-h-full flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-slate-100 to-indigo-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950">
                    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl p-8 transition-all">
                        <!-- Header -->
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 mb-4 text-2xl font-bold">
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight">ShopAI Assistant</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Strict Product Filtering & Exact INR (₹) Price Comparison</p>
                        </div>

                        <!-- Mode Switcher -->
                        <div class="flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${state.authMode === 'login' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">Sign In</button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${state.authMode === 'register' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}">Create Account</button>
                        </div>

                        <!-- Form -->
                        <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                            ${state.authMode === 'register' ? `
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Username</label>
                                    <input type="text" id="auth-username" required placeholder="e.g. rahul_sharma" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">
                                    ${state.authMode === 'login' ? 'Email ID or Username' : 'Email ID'}
                                </label>
                                <input type="text" id="auth-email" required placeholder="${state.authMode === 'login' ? 'rahul@example.com or username' : 'rahul@example.com'}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Password</label>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>

                            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-indigo-600/30">
                                ${state.authMode === 'login' ? 'Sign In to Assistant' : 'Register & Create Account'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function setAuthMode(mode) {
            state.authMode = mode;
            render();
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const emailInput = document.getElementById('auth-email').value.trim();
            const passwordInput = document.getElementById('auth-password').value.trim();

            if (state.authMode === 'register') {
                const usernameInput = document.getElementById('auth-username').value.trim();
                
                const existing = state.registeredUsers.find(u => u.email === emailInput || u.username === usernameInput);
                if (existing) {
                    showModal('Account Exists', 'An account with this email or username already exists. Please Sign In.', 'error');
                    return;
                }

                const newUser = {
                    username: usernameInput,
                    email: emailInput,
                    password: passwordInput,
                    avatar: `https://placehold.co/150x150/6366f1/ffffff?text=${usernameInput.charAt(0).toUpperCase()}`
                };

                state.registeredUsers.push(newUser);
                state.user = newUser;
                saveStateToStorage();
                showModal('Registration Successful', `Welcome to ShopAI, ${usernameInput}! Your account has been created.`, 'success');
                setTimeout(() => {
                    closeModal();
                    state.currentView = 'chat';
                    render();
                }, 1000);

            } else {
                const matchedUser = state.registeredUsers.find(u => (u.email === emailInput || u.username === emailInput) && u.password === passwordInput);
                
                if (matchedUser) {
                    state.user = matchedUser;
                    saveStateToStorage();
                    state.currentView = 'chat';
                    render();
                } else {
                    if (state.registeredUsers.length === 0) {
                        const defaultUser = {
                            username: emailInput.split('@')[0],
                            email: emailInput,
                            password: passwordInput,
                            avatar: `https://placehold.co/150x150/6366f1/ffffff?text=U`
                        };
                        state.registeredUsers.push(defaultUser);
                        state.user = defaultUser;
                        saveStateToStorage();
                        state.currentView = 'chat';
                        render();
                    } else {
                        showModal('Login Failed', 'Invalid email/username or password. Please verify your credentials.', 'error');
                    }
                }
            }
        }

        // ================= MAIN LAYOUT & CHAT INTERFACE =================
        function renderMainLayout() {
            return `
                <div class="flex h-full overflow-hidden">
                    <!-- Sidebar -->
                    <aside id="sidebar" class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 z-20 md:relative absolute inset-y-0 left-0 -translate-x-full md:translate-x-0">
                        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-600/30">
                                    <i class="fa-solid fa-bag-shopping"></i>
                                </div>
                                <div>
                                    <h2 class="font-bold text-white text-sm">ShopAI Assistant</h2>
                                    <p class="text-xs text-slate-400">Strict Filtering & INR (₹)</p>
                                </div>
                            </div>
                            <button onclick="toggleSidebarMobile()" class="md:hidden text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <div class="p-4">
                            <button onclick="startNewChat()" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/20">
                                <i class="fa-solid fa-plus"></i>
                                <span>New Shopping Query</span>
                            </button>
                        </div>

                        <div class="px-4 pb-2 space-y-1">
                            <button onclick="switchView('chat')" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-sm font-medium transition ${state.currentView === 'chat' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}">
                                <i class="fa-solid fa-comments w-5"></i>
                                <span>Active Chat</span>
                            </button>
                            <button onclick="switchView('wishlist')" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-sm font-medium transition ${state.currentView === 'wishlist' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}">
                                <i class="fa-solid fa-heart w-5 text-rose-500"></i>
                                <span>Saved Comparisons (${state.wishlist.length})</span>
                            </button>
                            <button onclick="switchView('settings')" class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl text-sm font-medium transition ${state.currentView === 'settings' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}">
                                <i class="fa-solid fa-gear w-5"></i>
                                <span>Profile & Settings</span>
                            </button>
                        </div>

                        <div class="flex-1 overflow-y-auto px-4 py-2 space-y-1 border-t border-slate-800">
                            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 px-3 py-2">Recent Queries</div>
                            <div id="chat-history-list" class="space-y-1">
                                ${state.conversations.map(c => `
                                    <div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-3 py-2 rounded-xl text-sm cursor-pointer transition ${c.id === state.activeChatId ? 'bg-slate-800 text-white font-medium' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'}">
                                        <div class="truncate flex items-center space-x-2">
                                            <i class="fa-solid fa-message text-xs opacity-70"></i>
                                            <span class="truncate">${c.title}</span>
                                        </div>
                                        <button onclick="deleteChat(event, '${c.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="p-4 border-t border-slate-800 flex items-center justify-between bg-slate-950/40">
                            <div class="flex items-center space-x-3 truncate">
                                <img src="${state.user.avatar}" class="w-9 h-9 rounded-full object-cover border border-slate-700">
                                <div class="truncate">
                                    <div class="text-sm font-bold text-white truncate">${state.user.username}</div>
                                    <div class="text-xs text-slate-400 truncate">${state.user.email}</div>
                                </div>
                            </div>
                            <button onclick="logout()" title="Logout" class="text-slate-400 hover:text-rose-400 p-2"><i class="fa-solid fa-right-from-bracket"></i></button>
                        </div>
                    </aside>

                    <!-- Main Content Viewport -->
                    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-950">
                        <header class="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10">
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleSidebarMobile()" class="md:hidden text-slate-600 dark:text-slate-300 hover:text-indigo-600 p-1"><i class="fa-solid fa-bars text-lg"></i></button>
                                <h1 class="text-base font-bold text-slate-900 dark:text-white capitalize">
                                    ${state.currentView === 'chat' ? 'AI Shopping Assistant' : state.currentView === 'wishlist' ? 'My Saved Comparisons & Wishlist' : 'Account Settings'}
                                </h1>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                    <i class="fa-solid ${document.documentElement.classList.contains('dark') ? 'fa-sun text-amber-400' : 'fa-moon text-slate-600'}"></i>
                                </button>
                            </div>
                        </header>

                        <div id="main-content-pane" class="flex-1 overflow-y-auto">
                            ${renderActiveViewContent()}
                        </div>
                    </main>
                </div>
            `;
        }

        function renderActiveViewContent() {
            if (state.currentView === 'wishlist') {
                return renderWishlistView();
            } else if (state.currentView === 'settings') {
                return renderSettingsView();
            } else {
                return renderChatView();
            }
        }

        // ================= CHAT & AI COMPARISON VIEW =================
        function renderChatView() {
            return `
                <div class="h-full flex flex-col max-w-5xl mx-auto w-full px-4 py-6">
                    <div id="chat-messages-scroll" class="flex-1 overflow-y-auto space-y-6 pr-2 mb-4">
                        ${state.activeMessages.length === 0 ? `
                            <div class="h-full flex flex-col items-center justify-center text-center p-8">
                                <div class="w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl mb-4 shadow-lg shadow-indigo-500/10 animate-glow">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                                </div>
                                <h3 class="text-xl font-bold mb-2">Welcome ${state.user.username}! What specifically are you looking for?</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mb-8">
                                    Mention the exact brand, model, specs, or budget. I will strictly filter unwanted items and compare exact prices across Amazon India, Flipkart, Croma, and Reliance Digital with direct store links!
                                </p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl text-left">
                                    <button onclick="sendQuickPrompt('ASUS TUF Gaming F15 RTX 4060 laptop')" class="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 bg-white dark:bg-slate-900 transition flex items-start space-x-3 group shadow-sm">
                                        <i class="fa-solid fa-laptop text-indigo-600 mt-1"></i>
                                        <div>
                                            <div class="text-xs font-bold group-hover:text-indigo-600 transition">ASUS TUF Gaming F15</div>
                                            <div class="text-xs text-slate-500">Strictly RTX 4060 model</div>
                                        </div>
                                    </button>
                                    <button onclick="sendQuickPrompt('Apple iPhone 15 128GB black')" class="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 bg-white dark:bg-slate-900 transition flex items-start space-x-3 group shadow-sm">
                                        <i class="fa-solid fa-mobile-screen text-indigo-600 mt-1"></i>
                                        <div>
                                            <div class="text-xs font-bold group-hover:text-indigo-600 transition">iPhone 15 128GB</div>
                                            <div class="text-xs text-slate-500">Exact price check & stores</div>
                                        </div>
                                    </button>
                                    <button onclick="sendQuickPrompt('Sony WH-CH720N headphones')" class="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 bg-white dark:bg-slate-900 transition flex items-start space-x-3 group shadow-sm">
                                        <i class="fa-solid fa-headphones text-indigo-600 mt-1"></i>
                                        <div>
                                            <div class="text-xs font-bold group-hover:text-indigo-600 transition">Sony WH-CH720N</div>
                                            <div class="text-xs text-slate-500">Exact model price match</div>
                                        </div>
                                    </button>
                                    <button onclick="sendQuickPrompt('Samsung Galaxy S24 256GB')" class="p-3 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 bg-white dark:bg-slate-900 transition flex items-start space-x-3 group shadow-sm">
                                        <i class="fa-solid fa-mobile-screen-button text-indigo-600 mt-1"></i>
                                        <div>
                                            <div class="text-xs font-bold group-hover:text-indigo-600 transition">Samsung Galaxy S24</div>
                                            <div class="text-xs text-slate-500">Strictly 256GB storage edition</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        ` : `
                            ${state.activeMessages.map(msg => renderMessageCard(msg)).join('')}
                        `}
                        
                        ${state.isSearching ? `
                            <div class="flex items-start space-x-4 my-4 animate-pulse">
                                <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-bold flex-shrink-0 shadow-md">
                                    <i class="fa-solid fa-robot"></i>
                                </div>
                                <div class="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
                                    <div class="flex items-center space-x-3 text-indigo-600 dark:text-indigo-400 mb-2">
                                        <i class="fa-solid fa-spinner fa-spin"></i>
                                        <span class="text-sm font-semibold">Strictly filtering stores for exact item match...</span>
                                    </div>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">Querying Amazon India, Flipkart, Croma, and Reliance Digital for exact specifications, reviews, and direct INR pricing...</p>
                                </div>
                            </div>
                        ` : ''}

        function sortComparisonItems(sortType) {
            const lastMsg = state.activeMessages.slice().reverse().find(m => m.comparisonData);
            if (!lastMsg) return;

            if (sortType === 'price-asc') {
                lastMsg.comparisonData.items.sort((a, b) => a.price - b.price);
            } else if (sortType === 'rating-desc') {
                lastMsg.comparisonData.items.sort((a, b) => b.rating - a.rating);
            } else if (sortType === 'store') {
                lastMsg.comparisonData.items.sort((a, b) => a.store.localeCompare(b.store));
            }
            render();
        }

        function openStoreRedirect(storeName, productName, url) {
            showModal('Opening Store Link', `Redirecting you to ${storeName} for "${productName}". Click below to visit the official store page:`, 'success', `
                <div class="flex space-x-3">
                    <a href="${url}" target="_blank" onclick="closeModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">Proceed to ${storeName}</a>
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl text-sm font-semibold transition">Close</button>
                </div>
            `);
        }

        // ================= WISHLIST =================
        function toggleWishlist(itemId) {
            let foundItem = null;
            for (let c of state.conversations) {
                for (let m of c.messages) {
                    if (m.comparisonData) {
                        const match = m.comparisonData.items.find(i => i.id === itemId);
                        if (match) { foundItem = match; break; }
                    }
                }
                if (foundItem) break;
            }

            if (!foundItem) return;

            const index = state.wishlist.findIndex(w => w.id === itemId);
            if (index > -1) {
                state.wishlist.splice(index, 1);
                showModal('Removed', 'Item removed from your saved comparisons.', 'info');
            } else {
                state.wishlist.push(foundItem);
                showModal('Saved to Wishlist', 'Item successfully added to your saved comparisons!', 'success');
            }
            saveStateToStorage();
            render();
        }

        function createNewChat(title) {
            const newChat = {

            state.conversations.unshift(newChat);
            state.activeChatId = newChat.id;
            state.activeMessages = newChat.messages;
            saveStateToStorage();
        }

        function startNewChat() {
            createNewChat("New Shopping Query");
            state.currentView = 'chat';
            render();

        function selectChat(id) {
            const chat = state.conversations.find(c => c.id === id);
            if (chat) {
                state.activeChatId = chat.id;
                state.activeMessages = chat.messages;
                state.currentView = 'chat';
                render();
            }
        }

            e.stopPropagation();
            state.conversations = state.conversations.filter(c => c.id !== id);
            if (state.conversations.length === 0) {
                createNewChat("New Shopping Query");
            } else if (state.activeChatId === id) {
                state.activeChatId = state.conversations[0].id;
                state.activeMessages = state.conversations[0].messages;
            }
            saveStateToStorage();
            render();
        }

        function updateActiveChatTitle(firstQuery) {
            const activeChat = state.conversations.find(c => c.id === state.activeChatId);
            if (activeChat && activeChat.title === "New Shopping Query") {
                activeChat.title = firstQuery.length > 28 ? firstQuery.substring(0, 28) + '...' : firstQuery;
            }
        }

        function switchView(view) {
            state.currentView = view;
            render();
        }

        function toggleSidebarMobile() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('shopai_theme', isDark ? 'dark' : 'light');
            render();
        }

        function logout() {
            state.user = null;
            state.currentView = 'auth';
            saveStateToStorage();
            render();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const scrollEl = document.getElementById('chat-messages-scroll');
                if (scrollEl) {
                    scrollEl.scrollTop = scrollEl.scrollHeight;
                }
            }, 50);
        }

        function initMainViewScripts() {
            scrollToBottom();
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('shopai_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            loadState();
            render();
        }
    </script>
</body>
</html>
